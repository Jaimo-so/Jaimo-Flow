<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="xterm.css"><style>
:root{--terminal-bg:#f4f7fc;--terminal-fg:#202a3a;--terminal-cursor:#007aff}
@media (prefers-color-scheme:dark){:root{--terminal-bg:#1a1c24;--terminal-fg:#f0f1f5;--terminal-cursor:#0a84ff}}
html,body,#terminal{width:100%;height:100%;margin:0;overflow:hidden;background:var(--terminal-bg)} #terminal{box-sizing:border-box;padding:14px 16px}.xterm{height:100%}
.xterm .xterm-viewport::-webkit-scrollbar{display:none}
</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script>
const xterm = window.JaimoXterm;
function terminalTheme() {
    const colors = getComputedStyle(document.documentElement);
    return {
        background: colors.getPropertyValue('--terminal-bg').trim(),
        foreground: colors.getPropertyValue('--terminal-fg').trim(),
        cursor: colors.getPropertyValue('--terminal-cursor').trim()
    };
}
const terminal = new xterm.Terminal({cursorBlink:true, fontFamily:'Menlo, monospace', fontSize:13, scrollback:10000, minimumContrastRatio:4.5, theme:terminalTheme()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    terminal.options.theme = terminalTheme();
});
const fit = new xterm.FitAddon(); terminal.loadAddon(fit); terminal.open(document.getElementById('terminal')); fit.fit();
const send = (type, value) => window.webkit.messageHandlers.terminal.postMessage({type,value});
terminal.onData(data => send('input',data));
terminal.onResize(size => send('resize',size));
window.terminalWrite = value => terminal.write(Uint8Array.from(atob(value), c => c.charCodeAt(0)));
window.terminalFocus = () => terminal.focus();
new ResizeObserver(() => fit.fit()).observe(document.getElementById('terminal'));
send('ready', {cols:terminal.cols, rows:terminal.rows}); terminal.focus();
</script></body></html>
